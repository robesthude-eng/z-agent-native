name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded PR run has no value and only delays the queue. Never cancel main:
# the Deploy workflow keys off a completed CI run for a specific SHA.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Blocking gates. Deploy runs on `workflow_run: CI completed && success`, so
  # every job below that is not `continue-on-error` is a real production gate.
  # ---------------------------------------------------------------------------

  native:
    name: Native runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate eval manifest
        run: npm run eval:validate
      - name: Native runtime tests
        run: npm run test:native

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # `if: always()` so one red step still reports the other two instead of
      # hiding them behind the first failure.
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Unit tests
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end suite
        run: npm run test:e2e
        env:
          # The e2e runtime is disposable and never holds provider credentials.
          Z_AGENT_ALLOW_OPEN_REGISTRATION: '1'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Report-only. These surface debt without blocking a deploy: formatting churn
  # and a fresh upstream advisory must not strand a runtime fix. Promote a step
  # to the blocking jobs above once it is green and stays green.
  # ---------------------------------------------------------------------------

  quality:
    name: Quality (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint
        if: always()
        run: npm run lint
      - name: Audit runtime dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
