name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run eval:validate
      - run: npm run test:native
      - run: npm test
      - if: always()
        run: npm run typecheck
      - if: always()
        run: npm run build
      - if: always()
        run: docker build -t z-agent-native:ci .
