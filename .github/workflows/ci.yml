name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Deploy gate. Only checks that are known to pass may block production, so a
  # red pre-existing frontend gate can never strand server fixes again.
  tests:
    name: Native tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:native

  # Report-only. continue-on-error keeps the workflow conclusion green so the
  # Deploy workflow still runs, while every failure stays visible in the run.
  quality:
    name: Quality (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint
        if: always()
        run: npm run lint
      - name: Frontend tests
        if: always()
        run: npm test
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Build
        if: always()
        run: npm run build
      - name: Audit runtime dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
