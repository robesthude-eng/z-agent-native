name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A superseded PR run has no value and only delays the queue. Never cancel main:
# the Deploy workflow keys off a completed CI run for a specific SHA.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Blocking gates. Deploy runs on `workflow_run: CI completed && success`, so
  # every job below that is not `continue-on-error` is a real production gate.
  # ---------------------------------------------------------------------------

  native:
    name: Native runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate eval manifest
        run: npm run eval:validate
      - name: Check capability documentation
        run: npm run docs:check
      - name: Deterministic agent smoke eval
        run: npm run eval:smoke
        env:
          # GH-hosted runner is not root and cannot allocate per-session UIDs.
          Z_AGENT_ALLOW_UNISOLATED_SHELL: '1'
      - name: Native runtime tests
        run: npm run test:native

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # `if: always()` so one red step still reports the remaining checks instead of
      # hiding them behind the first failure.
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Unit tests
        if: always()
        run: npm test
      - name: Build
        if: always()
        run: npm run build
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 5
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end suite
        run: npm run test:e2e
        env:
          # The e2e runtime is disposable and never holds provider credentials.
          Z_AGENT_ALLOW_OPEN_REGISTRATION: '1'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 5
          if-no-files-found: ignore

  security:
    name: Runtime dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Block new high/critical runtime advisories
        run: npm audit --omit=dev --audit-level=high

  # Formatting churn is useful feedback but not a production correctness gate.
  quality:
    name: Formatting (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lint correctness
        if: always()
        run: npm run lint:ci
      - name: Check formatting
        if: always()
        run: npm run format:check
