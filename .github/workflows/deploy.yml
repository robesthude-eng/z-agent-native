name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://agentwill.online

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan trusts whatever answers on the network at deploy time, so
          # a hijacked first connection would hand production to an attacker.
          # The host key must be pinned in a secret instead.
          if [ -z "$DEPLOY_SSH_HOST_KEY" ]; then
            echo 'DEPLOY_SSH_HOST_KEY secret is required (ssh-keyscan -t ed25519 <host> once, then store the line)' >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy verified commit to server
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" << 'DEPLOY'
            set -euo pipefail
            cd ~/z-agent-native

            echo "→ Fetching main and verified commit..."
            git fetch origin main
            LATEST_SHA="$(git rev-parse origin/main)"

            # CI runs can finish out of order. Never let an older successful run
            # roll production back after a newer commit has reached main.
            if [ "$LATEST_SHA" != "$DEPLOY_SHA" ]; then
              echo "→ Skipping superseded CI result: $DEPLOY_SHA"
              echo "→ Current main is: $LATEST_SHA"
              exit 0
            fi

            CURRENT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            if [ "$CURRENT_SHA" = "$DEPLOY_SHA" ] && curl -sf http://127.0.0.1:3002/health > /dev/null 2>&1; then
              echo "✓ Verified SHA is already deployed and healthy: $DEPLOY_SHA"
              exit 0
            fi

            git reset --hard "$DEPLOY_SHA"
            echo "→ Deploying verified SHA: $(git rev-parse HEAD)"

            echo "→ Building Docker image..."
            docker compose build --pull

            echo "→ Restarting services..."
            docker compose up -d --remove-orphans

            echo "→ Cleaning up old images..."
            docker image prune -f

            echo "→ Health check..."
            sleep 5
            if curl -sf http://127.0.0.1:3002/health > /dev/null 2>&1; then
              echo "✓ Application is healthy"
            else
              echo "✗ Application health check failed"
              docker compose logs --tail=50 z-agent
              exit 1
            fi

            echo "→ Status:"
            docker compose ps
          DEPLOY

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
