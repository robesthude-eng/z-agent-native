name: Server Terminal

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Команда для выполнения на сервере'
        required: true
        default: 'whoami && hostname && uptime'
      use_sudo:
        description: 'Выполнить от root (sudo)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: server-terminal
  cancel-in-progress: false

jobs:
  run:
    name: Execute on server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This workflow is a remote root shell on production. workflow_dispatch is
    # available to anyone with write access, so restrict it to the repository
    # owner and route it through an environment that can require a manual
    # approval before the SSH key is ever exposed to the job.
    if: github.actor == github.repository_owner
    environment: production

    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan trusts whatever answers at run time, which would hand a
          # root shell to anyone able to hijack the connection. Pin the key.
          if [ -z "$DEPLOY_SSH_HOST_KEY" ]; then
            echo 'DEPLOY_SSH_HOST_KEY secret is required (ssh-keyscan -t ed25519 <host> once, then store the line)' >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run command
        env:
          # Never interpolate ${{ inputs.* }} into a shell script: the value is
          # operator-supplied text and would execute on the runner itself.
          INPUT_COMMAND: ${{ inputs.command }}
          USE_SUDO: ${{ inputs.use_sudo }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ "$USE_SUDO" = 'true' ]; then
            REMOTE_CMD='sudo -n bash -s'
          else
            REMOTE_CMD='bash -s'
          fi
          # The command is piped to a remote shell instead of being embedded in
          # the ssh argument, so no quoting mistake can split it into extra
          # commands on either side.
          printf '%s\n' "$INPUT_COMMAND" | ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$REMOTE_CMD" 2>&1 | tee /tmp/output.txt

      - name: Summary
        if: always()
        run: |
          # Read the captured output from disk. Interpolating it into the script
          # would let remote output inject commands into this runner.
          {
            echo '### Server output'
            echo '```'
            cat /tmp/output.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
