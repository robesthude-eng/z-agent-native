services:
  z-agent:
    ports: !override
      - "127.0.0.1:3002:3000"
    environment:
      Z_AGENT_TERMINAL_ENABLED: '1'
      Z_AGENT_ALLOW_PRODUCTION_TERMINAL: '1'
      Z_AGENT_ALLOW_NETWORKED_INSTALLERS: '1'
  # Trusted single-tenant opt-in: package installs need outbound network.
  # Stay off the API network so agent code cannot reach /data or provider keys.
  # Default compose remains network_mode: none.
  z-agent-executor:
    network_mode: !override bridge
    environment:
      Z_AGENT_EXECUTOR_EXPECT_NETWORK_NONE: '0'
    tmpfs: !override
      - /tmp:size=256m,nosuid,nodev
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - z-agent
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - z-agent-caddy-data:/data
      - z-agent-caddy-config:/config
    networks:
      - default
      - runtime-egress

volumes:
  z-agent-caddy-data:
  z-agent-caddy-config:
