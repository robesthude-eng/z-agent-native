services:
  z-agent:
    ports: !override
      - "127.0.0.1:3002:3000"
    environment:
      Z_AGENT_TERMINAL_ENABLED: '1'
      Z_AGENT_ALLOW_PRODUCTION_TERMINAL: '1'
      Z_AGENT_ALLOW_NETWORKED_INSTALLERS: '1'
      Z_AGENT_NETWORK_POLICY: public
      Z_AGENT_ALLOW_PUBLIC_WEB: '1'
      Z_AGENT_SHELL_NETWORK_POLICY: open
      Z_AGENT_SSH_POLICY: any

  z-agent-executor:
    network_mode: !override bridge
    environment:
      Z_AGENT_EXECUTOR_EXPECT_NETWORK_NONE: '0'
    tmpfs: !override
      - /tmp:size=256m,nosuid,nodev

  z-agent-browser:
    environment:
      Z_AGENT_NETWORK_POLICY: public

  z-agent-browser-egress:
    environment:
      Z_AGENT_NETWORK_POLICY: public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - z-agent
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - z-agent-caddy-data:/data
      - z-agent-caddy-config:/config
    networks:
      - default
      - runtime-egress

volumes:
  z-agent-caddy-data:
  z-agent-caddy-config:
