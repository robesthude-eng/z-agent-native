# Local-host conveniences only.
#
# Docker Compose loads this file automatically, so it must never weaken the
# production security boundary. Everything that relaxes isolation -- the human
# terminal, networked installers, outbound agent network, SSH, a bridge-networked
# executor -- lives in docker-compose.trusted.yml and only takes effect when an
# operator passes that file explicitly with -f.
services:
  z-agent:
    ports: !override
      - "127.0.0.1:3002:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - z-agent
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - z-agent-caddy-data:/data
      - z-agent-caddy-config:/config
    networks:
      - default
      - runtime-egress

volumes:
  z-agent-caddy-data:
  z-agent-caddy-config:
